<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#141418"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <radialGradient id="redGlow" cx="880" cy="315" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#ff3c6e" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ff3c6e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="leftWarm" cx="300" cy="315" r="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#ff3c6e" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ff3c6e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#ff7aa8"/>
      <stop offset="50%"  stop-color="#ff3c6e"/>
      <stop offset="100%" stop-color="#cc1f4f"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="coreGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="orbClip">
      <circle cx="880" cy="315" r="190"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#redGlow)"/>
  <rect width="1200" height="630" fill="url(#leftWarm)"/>

  <!-- Top + bottom edge rules -->
  <line x1="0" y1="1"   x2="1200" y2="1"   stroke="#ffffff" stroke-width="1" opacity="0.04"/>
  <line x1="0" y1="629" x2="1200" y2="629" stroke="#ffffff" stroke-width="1" opacity="0.04"/>

  <!-- Vertical divider -->
  <line x1="660" y1="70" x2="660" y2="560" stroke="#ff3c6e" stroke-width="0.5" opacity="0.1"/>

  <!-- Left accent bar -->
  <rect x="68" y="175" width="4" height="280" rx="2" fill="#ff3c6e" opacity="0.85"/>

  <!-- CREATOR -->
  <text x="100" y="318"
    font-family="Arial Black, Impact, Helvetica Neue, sans-serif"
    font-weight="900"
    font-size="105"
    letter-spacing="-2"
    fill="#fafafa">CREATOR</text>

  <!-- OS -->
  <text x="100" y="438"
    font-family="Arial Black, Impact, Helvetica Neue, sans-serif"
    font-weight="900"
    font-size="105"
    letter-spacing="-2"
    fill="#ff3c6e">OS</text>

  <!-- Underline beneath OS -->
  <rect x="100" y="452" width="228" height="3" rx="1.5" fill="#ff3c6e" opacity="0.45"/>

  <!-- Tagline -->
  <text x="104" y="500"
    font-family="Courier New, Courier, monospace"
    font-size="14"
    letter-spacing="5"
    fill="#3f3f4a">PRIVATE CONTENT OPERATIONS</text>

  <!-- Footer label -->
  <text x="104" y="568"
    font-family="Courier New, Courier, monospace"
    font-size="11"
    letter-spacing="3"
    fill="#27272f">CREATOR-OS · LITE</text>

  <!-- ORB: solid dark base circle -->
  <circle cx="880" cy="315" r="190" fill="#0d0d10"/>

  <!-- ORB: clipped interior (paths scaled 0.75x from original 1024×1024 icon) -->
  <g clip-path="url(#orbClip)">
    <ellipse cx="880" cy="315" rx="120" ry="110" fill="#ff3c6e" fill-opacity="0.08"/>
    <!-- Thin ring hint: r=129, start=(960,380) end=(960,250) -->
    <path d="M 960,380 A 129,129 0 1,1 960,250"
      fill="none" stroke="#ff7aa8" stroke-width="1.5" stroke-linecap="round" opacity="0.13"/>
    <!-- Fat arc: r=161, stroke-width=57, start=(970,448) end=(970,182) -->
    <path d="M 970,448 A 161,161 0 1,1 970,182"
      fill="none" stroke="url(#brandGrad)" stroke-width="57" stroke-linecap="round" filter="url(#glow)"/>
    <!-- Arrow: (1052,315) (985,267) (985,363) -->
    <polygon points="1052,315 985,267 985,363" fill="url(#brandGrad)" filter="url(#glow)"/>
    <!-- Core dot -->
    <circle cx="880" cy="315" r="20" fill="url(#brandGrad)" filter="url(#coreGlow)"/>
    <circle cx="880" cy="315" r="9"  fill="#09090b"/>
  </g>

  <!-- Orb border rings -->
  <circle cx="880" cy="315" r="190" fill="none" stroke="#ff3c6e" stroke-width="1"   opacity="0.18"/>
  <circle cx="880" cy="315" r="218" fill="none" stroke="#ff3c6e" stroke-width="0.5" opacity="0.06"/>
</svg>
